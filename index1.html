<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder Project</title>
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="classes.html">Online Classes</a>
      <a href="reviews.html">Reviews & Queries</a>
      <a href="all-indian-recipes.html">All Indian Recipes</a>
    </nav>
    <div class="recipe-finder-container">
      <h1 style="color:whitesmoke">Recipe Finder</h1>
      <form id="search-form" class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search by name (eg. 'carrot')"
        />
        <button type="submit" id="search-button">Search</button>
      </form>
      <div class="random-button-container">
        <button id="random-button" class="random-button">
          Get Random Recipe
        </button>
      </div>
      <div class="message" id="message-area">
        Search for a recipe or get a random one!
      </div>
      <div class="last">
    	  <hr style="width: 15%;border: 1px solid grey;margin: auto;"><br>
    	  <p style="font-size: 15px;font-family: Arial;"> 
          Copyright © 2025 All rights reserved | This template is made with <span style="color: red;">❤</span> by <a href="#">Samridhi</a>
        </p>
      </div>
      <div class="results-grid" id="results-grid"></div>
    </div>
    <div class="modal-container hidden" id="recipe-modal">
      <div class="modal-content">
        <button id="modal-close-btn" class="modal-close-btn">+</button>
        <div id="recipe-details-content"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
